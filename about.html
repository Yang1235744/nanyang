<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum‑scale=1.0, user‑scalable=no"/>
<title>漫画图文字朗读 - 南阳数码工作室</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
body{background:#14161c;min-height:100vh;color:#fff;padding:20px 8px;}

/*方形摄像头取景框 */
.camera-wrap{
    width:100%;
    max-width:580px;
    aspect-ratio:1 / 1;
    margin:0 auto 14px;
    overflow:hidden;
    position:relative;
    border:2px solid #4096ff;
    border-radius:10px;
}
video{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,‑50%);
    min-width:100%;
    min-height:100%;
}

.divider{height:3px;background:#334155;width:95%;margin:14px auto;}

.tool-wrap{
    max-width:580px;
    margin:0 auto;
}
select{
    width:100%;
    padding:11px;
    border-radius:8px;
    margin:6px 0;
    background:#232732;
    color:#ffffff;
    border:1px solid #444854;
}
button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:none;
    border-radius:9px;
    font-size:16px;
    color:#fff;
}
#btnScan{background:#2773ff;}
#btnCopyText{background:#20aa58;}
#btnCopyImgBtn{background:#9449dd;}
#btnStopSpeak{background:#dc2626;}

#status{padding:8px 0;color:#cccccc;}
#textResult{
    min-height:140px;
    background:#232732;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
    margin-top:8px;
    color:#e4e6eb;
}
</style>
</head>
<body>
    <div class="camera-wrap">
        <video id="camVideo" autoplay playsinline muted></video>
    </div>

    <div class="divider"></div>

    <div class="tool-wrap">
        <div id="status">🔄正在加载OCR识别模型，请耐心等待……</div>
        <select id="voiceSelect">
            <option value="">加载本机语音列表……</option>
        </select>
        <button id="btnScan">拍摄识别并朗读</button>
        <button id="btnCopyText">复制识别文字</button>
        <button id="btnCopyImgBtn">复制画面图片链接</button>
        <button id="btnStopSpeak">停止朗读</button>
        <div id="textResult">识别结果会显示在这里</div>
    </div>

<script>
const camVideo = document.getElementById('camVideo');
const btnScan = document.getElementById('btnScan');
const btnCopyText = document.getElementById('btnCopyText');
const btnCopyImgBtn = document.getElementById('btnCopyImgBtn');
const btnStopSpeak = document.getElementById('btnStopSpeak');
const statusBox = document.getElementById('status');
const resultBox = document.getElementById('textResult');
const voiceSelect = document.getElementById('voiceSelect');

let lastImageUrl = "";
let lastText = "";
let ocrWorker = null;
let allVoices = [];

//加载本机系统全部语音
function fillVoiceList(){
    allVoices = speechSynthesis.getVoices();
    voiceSelect.innerHTML = "";
    if(allVoices.length === 0){
        voiceSelect.innerHTML = `<option value="">无可用网页语音</option>`;
        return;
    }
    allVoices.forEach((voice, index)=>{
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = voice.name;
        voiceSelect.appendChild(opt);
    })
}
speechSynthesis.onvoiceschanged = fillVoiceList;
fillVoiceList();

//一次性初始化OCR引擎
async function startOCR(){
    ocrWorker = await Tesseract.createWorker("chi_sim+eng");
    statusBox.innerText = "✅准备完毕！把漫画放入方框，点击按钮拍摄识别";
    btnScan.disabled = false;
}

//启动手机后置摄像头
navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
}).then(stream=>{
    camVideo.srcObject = stream;
    startOCR();
}).catch(err=>{
    statusBox.innerText = "❌摄像头权限失败！网站必须HTTPS，不要本地双击html\n"+err.message;
})
btnScan.disabled = true;

//点击拍摄识别
btnScan.onclick = async function(){
    btnScan.disabled = true;
    statusBox.innerText = "🔄正在识别图片文字……";
    resultBox.innerText = "处理中……";

    //截取画面中间正方形区域
    const vw = camVideo.videoWidth;
    const vh = camVideo.videoHeight;
    const squareSize = Math.min(vw, vh);
    const offsetX = (vw - squareSize)/2;
    const offsetY = (vh - squareSize)/2;

    const canvas = document.createElement('canvas');
    canvas.width = squareSize;
    canvas.height = squareSize;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(camVideo, offsetX, offsetY, squareSize, squareSize, 0,0, squareSize, squareSize);

    lastImageUrl = canvas.toDataURL("image/png");
    const res = await ocrWorker.recognize(canvas);
    lastText = res.data.text.trim();

    resultBox.innerText = lastText || "未识别到文字";
    statusBox.innerText = "✅识别完成，可以继续拍摄";

    //朗读，绑定在点击同步事件，修复安卓拦截
    speechSynthesis.cancel();
    if(lastText){
        const utter = new SpeechSynthesisUtterance(lastText);
        const selectedVoice = allVoices[voiceSelect.value];
        if(selectedVoice) utter.voice = selectedVoice;
        utter.lang = "zh‑CN";
        utter.rate = 1.05;
        //捕获语音报错
        utter.onerror = (e)=>{
            statusBox.innerText = "⚠️语音播放失败，请切换其他系统语音";
        }
        speechSynthesis.speak(utter);
    }
    btnScan.disabled = false;
}

btnCopyText.onclick = async function(){
    if(!lastText){alert("请先拍摄识别！");return;}
    await navigator.clipboard.writeText(lastText);
    alert("✅文字复制成功");
}

btnCopyImgBtn.onclick = async function(){
    if(!lastImageUrl){alert("请先拍摄识别！");return;}
    await navigator.clipboard.writeText(lastImageUrl);
    alert("✅图片链接复制成功");
}

btnStopSpeak.onclick = function(){
    speechSynthesis.cancel();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum‑scale=1.0, user‑scalable=no"/>
<title>漫画图文字朗读 - 南阳数码工作室</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
body{background:url(https://picsum.photos/id/1036/1920/1080) no-repeat center center fixed;background-size:cover;position:relative;min-height:100vh;color:#fff;}
body::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:-1;}
.nav{position:fixed;top:0;left:0;width:100%;padding:15px 30px;background:rgba(0,0,0,0.85);display:flex;justify-content:space-between;align-items:center;z-index:999;}
.nav .logo{font-size:22px;font-weight:bold;color:#87CEEB;}
.nav .menu a{color:#ccc;text-decoration:none;margin-left:25px;font-size:16px;}
.nav .menu a:hover{color:#fff;}

.container{width:100%;max-width:700px;margin:0 auto;padding:120px 15px 60px;text-align:center;}

/*方形摄像头取景框*/
.camera-wrap{
    width:100%;
    aspect-ratio:1 / 1;
    margin:0 auto 14px;
    overflow:hidden;
    position:relative;
    border:2px solid #4096ff;
    border-radius:10px;
}
video{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    min-width:100%;
    min-height:100%;
}

.divider{height:4px;background:#297bff;width:100%;margin:12px 0}

.tool-wrap{text-align:left}
button{width:100%;padding:13px;margin:6px 0;border:none;border-radius:9px;font-size:16px;color:#fff}
#btnScan{background:#2773ff}
#btnCopyText{background:#20aa58}
#btnCopyImgUrl{background:#9449dd}
#btnStopSpeak{background:#bb3333}
#status{padding:8px 0;color:#cccccc}
#textResult{min-height:140px;background:rgba(30,30,36,0.7);padding:10px;border-radius:8px;white-space:pre-wrap;margin-top:8px}
</style>
</head>
<body>
<div class="nav">
  <div class="logo">南阳数码工作室</div>
  <div class="menu">
    <a href="./index.html">首页</a>
    <a href="https://www.microsoft.com" target="_blank">微软官方地址</a>
    <a href="./index.html">系统镜像下载</a>
    <a href="./about.html">漫画图文字朗读</a>
  </div>
</div>

<div class="container">
    <h2 style="margin-bottom:16px;color:#87CEEB">摄像头漫画文字识别朗读</h2>

    <!--摄像头拍照区域-->
    <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="divider"></div>

    <div class="tool-wrap">
        <div id="status">正在启动摄像头……</div>
        <button id="btnScan">拍摄识别并朗读</button>
        <button id="btnCopyText">复制识别文字</button>
        <button id="btnCopyImgUrl">复制画面图片链接</button>
        <button id="btnStopSpeak">停止朗读</button>
        <div id="textResult">识别结果会显示在这里</div>
    </div>
</div>

<script>
const video = document.getElementById('video');
const btnScan = document.getElementById('btnScan');
const btnCopyText = document.getElementById('btnCopyText');
const btnCopyImgUrl = document.getElementById('btnCopyImgUrl');
const btnStopSpeak = document.getElementById('btnStopSpeak');
const statusBox = document.getElementById('status');
const resultBox = document.getElementById('textResult');

let lastImageUrl = "";
let lastText = "";

//启动手机后置摄像头
navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
}).then(stream=>{
    video.srcObject = stream;
    statusBox.innerText="方形取景框就绪，把漫画完整放进方框内，点按钮识别";
}).catch(err=>{
    statusBox.innerText="摄像头权限失败："+err.message+"\n线上网站必须HTTPS，本地要用http服务，不能直接双击html";
})

//点击拍照识别
btnScan.onclick = async function(){
    btnScan.disabled=true;
    statusBox.innerText="正在截图+识别文字……";
    resultBox.innerText="处理中……";

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const squareSize = Math.min(vw, vh);
    const sx = (vw - squareSize)/2;
    const sy = (vh - squareSize)/2;

    const canvas = document.createElement('canvas');
    canvas.width = squareSize;
    canvas.height = squareSize;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, sx, sy, squareSize, squareSize, 0,0, squareSize, squareSize);

    lastImageUrl = canvas.toDataURL("image/png");

    const worker = await Tesseract.createWorker("chi_sim+eng");
    const ret = await worker.recognize(canvas);
    await worker.terminate();

    lastText = ret.data.text.trim();
    resultBox.innerText = lastText || "没有识别到文字";
    statusBox.innerText="识别完成";

    window.speechSynthesis.cancel();
    if(lastText){
        const utter = new SpeechSynthesisUtterance(lastText);
        utter.lang="zh‑CN";
        speechSynthesis.speak(utter);
    }
    btnScan.disabled=false;
}

btnCopyText.onclick = async function(){
    if(!lastText){alert("先执行识别");return}
    await navigator.clipboard.writeText(lastText);
    alert("文字已复制");
}

btnCopyImgUrl.onclick = async function(){
    if(!lastImageUrl){alert("先点拍摄识别");return}
    await navigator.clipboard.writeText(lastImageUrl);
    alert("图片链接已复制");
}

btnStopSpeak.onclick = function(){
    speechSynthesis.cancel();
}
</script>
</body>
</html>

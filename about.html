<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial‑scale=1.0, maximum‑scale=1.0, user‑scalable=no"/>
<title>方形框摄像头漫画文字识别朗读工具</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#121214;color:#eee;font‑size:15px}

/* 方形摄像头容器 */
.camera‑wrap{
    width:100%;
    max‑width:600px;
    aspect‑ratio:1 / 1;
    margin:0 auto;
    overflow:hidden;
    position:relative;
    border:2px solid #4096ff;
}
video{
    position:absolute;
    /* 居中裁切，填满正方形方框 */
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    min‑width:100%;
    min‑height:100%;
}

.divider{height:4px;background:#297bff;width:100%;margin:12px 0}

.tool‑wrap{padding:0 12px 12px}
button{width:100%;padding:13px;margin:6px 0;border:none;border‑radius:9px;font‑size:16px}
#btnScan{background:#2773ff;color:#fff}
#btnCopyText{background:#20aa58;color:#fff}
#btnCopyImgUrl{background:#9449dd;color:#fff}
#btnStopSpeak{background:#bb3333;color:#fff}
#status{padding:8px 0;color:#aaa}
#textResult{min‑height:140px;background:#1e1e24;padding:10px;border‑radius:8px;white‑space:pre‑wrap;margin‑top:8px}
</style>
</head>
<body>
<div class="camera‑wrap">
<video id="video" autoplay playsinline muted></video>
</div>

<div class="divider"></div>

<div class="tool‑wrap">
<div id="status">正在启动摄像头……</div>
<button id="btnScan">拍摄识别并朗读</button>
<button id="btnCopyText">复制识别文字</button>
<button id="btnCopyImgUrl">复制画面图片链接</button>
<button id="btnStopSpeak">停止朗读</button>
<div id="textResult">识别结果会显示在这里</div>
</div>

<script>
const video = document.getElementById('video');
const btnScan = document.getElementById('btnScan');
const btnCopyText = document.getElementById('btnCopyText');
const btnCopyImgUrl = document.getElementById('btnCopyImgUrl');
const btnStopSpeak = document.getElementById('btnStopSpeak');
const statusBox = document.getElementById('status');
const resultBox = document.getElementById('textResult');

let lastImageUrl = "";
let lastText = "";

navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
}).then(stream=>{
    video.srcObject = stream;
    statusBox.innerText="方形取景框就绪，把漫画完整放进方框内，点按钮识别";
}).catch(err=>{
    statusBox.innerText="摄像头权限失败："+err.message+"\n必须http服务打开，不能直接双击html";
})

btnScan.onclick = async function(){
    btnScan.disabled=true;
    statusBox.innerText="正在截图+识别文字……";
    resultBox.innerText="处理中……";

    // 取视频中间正方形区域截图，和预览框对齐
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const squareSize = Math.min(vw, vh);
    const sx = (vw - squareSize)/2;
    const sy = (vh - squareSize)/2;

    const canvas = document.createElement('canvas');
    canvas.width = squareSize;
    canvas.height = squareSize;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, sx, sy, squareSize, squareSize, 0,0, squareSize, squareSize);

    lastImageUrl = canvas.toDataURL("image/png");

    const worker = await Tesseract.createWorker("chi_sim+eng");
    const ret = await worker.recognize(canvas);
    await worker.terminate();

    lastText = ret.data.text.trim();
    resultBox.innerText = lastText || "没有识别到文字";
    statusBox.innerText="识别完成";

    window.speechSynthesis.cancel();
    if(lastText){
        const utter = new SpeechSynthesisUtterance(lastText);
        utter.lang="zh‑CN";
        speechSynthesis.speak(utter);
    }
    btnScan.disabled=false;
}

btnCopyText.onclick = async function(){
    if(!lastText){alert("先执行识别");return}
    await navigator.clipboard.writeText(lastText);
    alert("文字已复制");
}

btnCopyImgUrl.onclick = async function(){
    if(!lastImageUrl){alert("先点拍摄识别");return}
    await navigator.clipboard.writeText(lastImageUrl);
    alert("图片链接已复制");
}

btnStopSpeak.onclick = function(){
    speechSynthesis.cancel();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南阳AI</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  user-select: none;
}
body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: url(https://picsum.photos/id/1036/1920/1080) center/cover no-repeat;
  animation: macFadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

/* 顶部栏 */
.mac-top {
  width: 100%;
  height: 38px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.back-btn {
  color: #fff;
  font-size: 14px;
  padding: 4px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  text-decoration: none;
  transition: all 0.3s ease;
}
.back-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}
.opacity-group {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #eee;
  font-size: 13px;
}

/* 胶囊滑块 */
.glass-slider {
  -webkit-appearance: none;
  width: 110px;
  height: 28px;
  border-radius: 999px;
  background: rgba(255,255,255,0.1);
  outline: none;
  position: relative;
  --fill: 100%;
}
.glass-slider::before {
  content: "";
  position: absolute;
  left: 0;top: 0;
  width: var(--fill);
  height: 100%;
  background: rgba(135,206,235,0.55);
  border-radius: 999px;
  transition: width 0.15s cubic-bezier(0.25,1,0.5,1);
}
.glass-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;height: 24px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* 桌面图标 */
.desktop-icons {
  position: absolute;
  top: 60px;
  left: 25px;
  display: flex;
  flex-direction: column;
  gap: 30px;
  z-index: 5;
}
.icon-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: #fff;
  cursor: pointer;
  animation: iconAppear 0.7s ease backwards;
  transition: transform 0.2s cubic-bezier(0.25,1,0.5,1);
}
.icon-item:hover {
  transform: scale(1.1);
}
.icon-item:nth-child(1){animation-delay:0.1s;}
.icon-item:nth-child(2){animation-delay:0.2s;}
.icon-item:nth-child(3){animation-delay:0.3s;}
.icon-item:nth-child(4){animation-delay:0.4s;}
.icon-item:nth-child(5){animation-delay:0.5s;}
.icon-box {
  width: 58px;height: 58px;
  border-radius: 14px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  font-size: 28px;
}
.icon-text {
  font-size: 13px;
  text-shadow: 0 1px 3px #000;
}
.dev-text {
  font-size: 11px;
  color: #ffd040;
}

/* 窗口样式 */
.mac-window {
  position: fixed;
  width: 900px;
  height: 600px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(30,30,30,0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 10;
}
.mac-window.active {
  opacity: 1;
  pointer-events: auto;
  animation: windowOpenFromDock 0.4s cubic-bezier(0.2,1,0.3,1) forwards;
}
.mac-window.minify {
  animation: windowMinify 0.4s cubic-bezier(0.6,0,0.2,1) forwards;
  pointer-events: none;
}
.mac-window.full {
  width: 100vw;
  height: 100vh;
  border-radius: 0;
}
.win-top {
  height: 36px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  cursor: move;
}
/* 重点：三个按钮提升点击层级，百分百能点 */
.win-btn {
  width: 14px;height: 14px;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  z-index: 20;
  pointer-events: auto !important;
}
.win-close {background: #ff5f57;}
.win-min {background: #ffbd2e;}
.win-max {background: #28c840;}
.win-iframe {
  width: 100%;
  height: calc(100% - 36px);
  border: none;
}

/* 右键菜单 */
.right-menu {
  position: fixed;
  width: 120px;
  background: rgba(20,20,20,0.9);
  backdrop-filter: blur(10px);
  border-radius: 8px;
  padding: 6px 0;
  z-index: 999;
  display: none;
}
.right-menu div {
  color: #fff;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
}

/* Dock任务栏 带回弹 */
.mac-dock {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(14px) saturate(200%);
  border-radius: 22px;
  z-index: 99;
}
.dock-icon {
  width: 44px;height: 44px;
  border-radius: 12px;
  background: rgba(255,255,255,0.12);
  display: grid;
  place-items: center;
  font-size: 20px;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s;
}
.dock-icon:active {
  animation: dockBounceOnce 0.3s;
}
.dock-icon.running::after{
  content: '';
  position: absolute;
  bottom: -6px;left: 50%;
  transform: translateX(-50%);
  width: 5px;height: 5px;
  background: #fff;border-radius: 50%;
}

/* 动画 */
@keyframes windowOpenFromDock {
  0% {opacity:0;transform:translate(-50%,160px) scale(0.1);}
  100% {opacity:1;transform:translate(-50%,-50%) scale(1);}
}
@keyframes windowMinify {
  0% {opacity:1;transform:translate(-50%,-50%) scale(1);}
  100% {opacity:0;transform:translate(-50%,160px) scale(0.1);}
}
@keyframes dockBounceOnce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-8px);}
}
@keyframes macFadeIn {from {opacity: 0;}to {opacity: 1;}}
@keyframes iconAppear {from {opacity: 0; transform: translateY(20px);}to {opacity: 1;}}
/* QQ音乐唱片旋转动画 */
@keyframes rotateDisk{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes breathLight{0%,100%{opacity:0.6}50%{opacity:1}}
</style>
</head>
<body>

<div class="mac-top">
  <a href="#" class="back-btn">返回首页</a>
  <div class="opacity-group">
    <span>毛玻璃透明度</span>
    <input type="range" min="0" max="1" step="0.01" value="1" class="glass-slider" id="glassSlider">
  </div>
</div>

<div class="desktop-icons">
  <div class="icon-item" data-url="https://www.doubao.com" data-key="ai">
    <div class="icon-box">🫧</div>
    <div class="icon-text">豆包</div>
  </div>
  <div class="icon-item" data-url="https://yuanbao.tencent.com" data-key="yuanbao">
    <div class="icon-box">💬</div>
    <div class="icon-text">腾讯元宝AI</div>
  </div>
  <div class="icon-item" data-url="https://kimi.moonshot.cn" data-key="kimi">
    <div class="icon-box">🔮</div>
    <div class="icon-text">Kimi</div>
  </div>
  <div class="icon-item" data-url="" data-key="nyai">
    <div class="icon-box">🤖</div>
    <div class="icon-text">南阳AI<br><span class="dev-text">正在开发中</span></div>
  </div>
  <!-- 新增QQ音乐桌面图标 -->
  <div class="icon-item" data-url="qqmusic-inner" data-key="qqmusic">
    <div class="icon-box">🎵</div>
    <div class="icon-text">QQ音乐</div>
  </div>
</div>

<div class="right-menu" id="rightMenu">
  <div data-a="close">关闭窗口</div>
  <div data-a="min">最小化</div>
  <div data-a="max">全屏还原</div>
</div>

<div class="mac-dock">
  <div class="dock-icon" id="dockHome">🏠</div>
  <div class="dock-icon" id="dockAi">🤖</div>
  <div class="dock-icon" id="dockYuanbao">💬</div>
  <div class="dock-icon" id="dockKimi">🔮</div>
  <!-- 新增QQ音乐Dock图标 -->
  <div class="dock-icon" id="dockQqmusic">🎵</div>
  <div class="dock-icon" id="dockSet">⚙️</div>
</div>

<script>
const slider = document.getElementById('glassSlider');
function setOp(v){
  document.querySelector('.mac-top').style.background=`rgba(255,255,255,${0.12*v})`;
  document.querySelector('.mac-dock').style.background=`rgba(255,255,255,${0.18*v})`;
}
slider.oninput=()=>setOp(slider.value);

const appPool = {};
let zIdx = 20;
let rightWin = null;

// 自定义QQ音乐动画页面HTML
const qqMusicHtml = `
<div style="width:100%;height:100%;background:linear-gradient(145deg,#121c22,#1a2933);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">
  <div style="width:200px;height:200px;border-radius:50%;background:#222;border:10px solid #2b3842;animation:rotateDisk 10s linear infinite;box-shadow:0 0 40px #2ec77044;display:flex;align-items:center;justify-content:center;">
    <div style="width:50px;height:50px;background:#ffffff22;border-radius:50%;"></div>
  </div>
  <div style="color:#2ec77c;font-size:17px;margin-top:30px;animation:breathLight 2s ease-in-out infinite;letter-spacing:2px;">QQ音乐 · 动态播放面板</div>
  <div style="display:flex;gap:22px;margin-top:35px;">
    <button style="width:48px;height:48px;border-radius:50%;border:none;background:#2ec77c20;color:#2ec77c;cursor:pointer;transition:all 0.3s ease;">上一曲</button>
    <button style="width:60px;height:60px;border-radius:50%;border:none;background:#2ec77c;color:#fff;cursor:pointer;transition:all 0.3s ease;box-shadow:0 0 20px #2ec77055;">播放</button>
    <button style="width:48px;height:48px;border-radius:50%;border:none;background:#2ec77c20;color:#2ec77c;cursor:pointer;transition:all 0.3s ease;">下一曲</button>
  </div>
</div>
`;

function newWin(url,key){
  if(appPool[key]){
    // 已经存在：最小化就恢复，显示就最小化
    let w = appPool[key];
    if(w.classList.contains('minify')){
      w.classList.remove('minify');
      w.classList.add('active');
    }else{
      w.classList.add('minify');
      w.classList.remove('active');
    }
    return;
  }
  zIdx++;
  const wrap = document.createElement('div');
  wrap.className = 'mac-window';
  wrap.style.zIndex = zIdx;
  // 判断是否是QQ音乐，不用iframe，用内置动画面板
  if(url === 'qqmusic-inner'){
    wrap.innerHTML = `
      <div class="win-top">
        <div class="win-btn win-close"></div>
        <div class="win-btn win-min"></div>
        <div class="win-btn win-max"></div>
      </div>
      ${qqMusicHtml}
    `;
  }else{
    wrap.innerHTML = `
      <div class="win-top">
        <div class="win-btn win-close"></div>
        <div class="win-btn win-min"></div>
        <div class="win-btn win-max"></div>
      </div>
      <iframe class="win-iframe" src="${url}"></iframe>
    `;
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.classList.add('active'),10);
  appPool[key] = wrap;
  refreshDock();

  // 三个按钮单独绑定，百分百可点击
  wrap.querySelector('.win-close').onclick=()=>{
    wrap.classList.add('minify');
    setTimeout(()=>{wrap.remove();delete appPool[key];refreshDock();},380);
  };
  wrap.querySelector('.win-min').onclick=()=>{
    wrap.classList.add('minify');
    wrap.classList.remove('active');
  };
  wrap.querySelector('.win-max').onclick=()=>wrap.classList.toggle('full');

  wrap.querySelector('.win-top').oncontextmenu=e=>{
    e.preventDefault();rightWin=wrap;
    document.getElementById('rightMenu').style.left=e.pageX+'px';
    document.getElementById('rightMenu').style.top=e.pageY+'px';
    document.getElementById('rightMenu').style.display='block';
  };

  // 正常拖拽，不卡死、不误关闭
  let drag = false,x1,y1,l,t;
  const bar = wrap.querySelector('.win-top');
  bar.onmousedown=e=>{
    // 点三个按钮时，不触发拖拽
    if(e.target.classList.contains('win-btn')) return;
    drag=true;
    x1=e.clientX;y1=e.clientY;
    const rect=wrap.getBoundingClientRect();
    l=rect.left;t=rect.top;
    wrap.style.transform='none';
    wrap.style.left=l+'px';wrap.style.top=t+'px';
  };
  document.onmousemove=e=>{
    if(!drag)return;
    wrap.style.left=(l+e.clientX-x1)+'px';
    wrap.style.top=(t+e.clientY-y1)+'px';
  };
  document.onmouseup=()=>drag=false;
}

function refreshDock(){
  document.querySelectorAll('.dock-icon').forEach(d=>d.classList.remove('running'));
  if(appPool.ai) dockAi.classList.add('running');
  if(appPool.yuanbao) dockYuanbao.classList.add('running');
  if(appPool.kimi) dockKimi.classList.add('running');
  if(appPool.nyai) dockAi.classList.add('running');
  if(appPool.qqmusic) dockQqmusic.classList.add('running');
}

document.querySelectorAll('.icon-item').forEach(i=>{
  i.onclick=()=>newWin(i.dataset.url,i.dataset.key);
});

document.getElementById('rightMenu').onclick=e=>{
  const a=e.target.dataset.a;
  if(!rightWin)return;
  if(a==='close') rightWin.querySelector('.win-close').click();
  if(a==='min') rightWin.querySelector('.win-min').click();
  if(a==='max') rightWin.querySelector('.win-max').click();
  document.getElementById('rightMenu').style.display='none';
};
document.onclick=()=>document.getElementById('rightMenu').style.display='none';

dockHome.onclick=()=>location.reload();
dockAi.onclick=()=>newWin('https://www.doubao.com','nyai');
dockYuanbao.onclick=()=>newWin('https://yuanbao.tencent.com','yuanbao');
dockKimi.onclick=()=>newWin('https://kimi.moonshot.cn','kimi');
// QQ音乐Dock点击事件
dockQqmusic.onclick=()=>newWin('qqmusic-inner','qqmusic');
dockSet.onclick=()=>newWin('','set');
</script>

</body>
</html>

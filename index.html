<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南阳音乐</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
}
:root {
    --blue: #00a1ff;
    --purple: #a855f7;
    --bg-base: #040610;
    --glass: rgba(255,255,255,0.04);
    --glass-stong: rgba(255,255,255,0.08);
    --border-line: rgba(255,255,255,0.07);
    --text-white: #ffffff;
    --text-gray: #b2b2c8;
    --transition-all: all 0.24s ease;
}
html {
    scroll-behavior: smooth;
}
body {
    min-height: 100vh;
    color: var(--text-white);
    overflow-x: hidden;
    position: relative;
    background: var(--bg-base);
    animation: pageFadeIn 0.9s ease forwards;
}
/* 蓝紫流动光带背景，纯CSS无图片 */
.bg-flow-wrap {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
}
.light-strip {
    position: absolute;
    width: 160%;
    height: 160%;
    top: -40%;
    left: -40%;
    background: conic-gradient(
        transparent 0 40%,
        rgba(0,200,255,0.15) 45% 50%,
        transparent 50% 90%,
        rgba(168,85,247,0.15) 95% 100%
    );
    animation: rotateLight 20s linear infinite;
}
.light-strip:nth-child(2) {
    animation-duration: 26s;
    animation-direction: reverse;
    opacity: 0.55;
    filter: blur(40px);
}
@keyframes rotateLight {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(4,6,16,0.65);
    z-index: -1;
}
/* 页面入场淡入动画 */
@keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
/* 顶部圆角玻璃导航栏 */
header {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1180px, 94%);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 999px;
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    background: var(--glass);
    border: 1px solid var(--border-line);
    z-index: 999;
    transition: var(--transition-all);
}
header.scroll-active {
    background: rgba(4,6,16,0.85);
    box-shadow: 0 6px 30px rgba(0,0,0,0.4);
    top: 12px;
}
.nav-left a {
    text-decoration: none;
    color: var(--text-white);
    font-size: 16px;
    font-weight: 600;
    margin-right: 36px;
    transition: var(--transition-all);
}
.nav-left a:hover {
    color: var(--blue);
}
.nav-left a.active {
    border-bottom: 2px solid var(--blue);
    padding-bottom: 4px;
}
.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}
.search-box {
    width: 260px;
    height: 38px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--border-line);
    padding: 0 16px;
    color: #fff;
    outline: none;
    font-size: 14px;
}
.search-box::placeholder {
    color: #777;
}
.download-nav {
    padding: 9px 24px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    transition: var(--transition-all);
}
.download-nav:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 22px rgba(0,200,255,0.35);
}
/* 首页主视觉区域 */
.banner {
    width: min(1200px, 92%);
    margin: 0 auto;
    padding-top: 160px;
    min-height: 100vh;
}
.banner-title h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 12px;
    animation: titleFloat 1s ease forwards;
    opacity: 0;
    transform: translateY(30px);
}
@keyframes titleFloat {
    to { opacity: 1; transform: translateY(0); }
}
.banner-title p {
    font-size: 24px;
    color: var(--text-gray);
    margin-bottom: 80px;
    animation: textFloat 1s 0.2s ease forwards;
    opacity: 0;
    transform: translateY(24px);
}
@keyframes textFloat {
    to { opacity: 1; transform: translateY(0); }
}
/* 3D立体卡片容器 */
.card-stack {
    position: relative;
    width: 100%;
    min-height: 520px;
    perspective: 1200px;
}
/* 左侧卡片 图1.png */
.card-small-1 {
    position: absolute;
    top: 0;
    left: 2%;
    width: 360px;
    padding: 28px;
    border-radius: 18px;
    backdrop-filter: blur(16px);
    background: var(--glass-stong);
    border: 1px solid var(--border-line);
    transform: rotateY(-12deg) rotateX(6deg);
    animation: cardShow 1s 0.4s ease forwards;
    opacity: 0;
}
.card-small-1 .preview-img {
    width: 100%;
    height: 140px;
    border-radius: 12px;
    margin-bottom: 16px;
    object-fit: cover;
}
/* 右侧卡片 图2.png */
.card-small-2 {
    position: absolute;
    top: 40px;
    right: 2%;
    width: 340px;
    padding: 28px;
    border-radius: 18px;
    backdrop-filter: blur(16px);
    background: var(--glass-stong);
    border: 1px solid var(--border-line);
    transform: rotateY(12deg) rotateX(6deg);
    animation: cardShow 1s 0.6s ease forwards;
    opacity: 0;
}
.card-small-2 .preview-img {
    width: 100%;
    height: 140px;
    border-radius: 12px;
    margin-bottom: 16px;
    object-fit: cover;
}
@keyframes cardShow {
    to { opacity: 1; transform: translateY(0); }
}
.card-small-1 h3, .card-small-2 h3 {
    font-size: 22px;
    margin-bottom: 10px;
}
.card-small-1 p, .card-small-2 p {
    color: var(--text-gray);
    font-size: 14px;
    line-height: 1.6;
}
/* 底部主下载卡片 */
.card-main-download {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(720px, 98%);
    padding: 42px;
    border-radius: 22px;
    backdrop-filter: blur(20px);
    background: var(--glass-stong);
    border: 1px solid var(--border-line);
    animation: bigCardUp 1s 0.8s ease forwards;
    opacity: 0;
    transform: translateX(-50%) translateY(40px);
}
@keyframes bigCardUp {
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.card-main-download h2 {
    font-size: 32px;
    margin-bottom: 18px;
}
.card-main-download p {
    color: var(--text-gray);
    line-height: 1.7;
    max-width: 600px;
    margin: 0 auto 36px;
}
.download-btn-wrap {
    display: flex;
    gap: 20px;
    justify-content: center;
}
.download-main-btn {
    padding: 14px 36px;
    border-radius: 999px;
    background: #000000;
    color: #fff;
    font-size: 17px;
    border: none;
    cursor: pointer;
    transition: var(--transition-all);
}
.download-main-btn:hover {
    background: #111;
    transform: scale(1.04);
}
.download-side-btn {
    padding: 14px 30px;
    border-radius: 999px;
    background: var(--glass);
    color: #fff;
    border: 1px solid var(--border-line);
    cursor: pointer;
    transition: var(--transition-all);
}
.download-side-btn:hover {
    background: rgba(255,255,255,0.1);
}
/* 3D AI播放器视觉展示区 */
.player-section {
    width: min(1200px, 92%);
    margin: 160px auto;
    text-align: center;
}
.player-section h2 {
    font-size: 40px;
    margin-bottom: 60px;
    opacity: 0;
    transform: translateY(30px);
    transition: 0.8s ease;
}
.player-section h2.show {
    opacity: 1;
    transform: translateY(0);
}
.player-3d-box {
    width: min(900px, 100%);
    height: 420px;
    margin: 0 auto;
    border-radius: 20px;
    backdrop-filter: blur(18px);
    background: var(--glass-stong);
    border: 1px solid var(--border-line);
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    transform: rotateX(8deg) rotateY(-6deg);
    transition: transform 0.3s ease;
    opacity: 0;
}
.player-3d-box.show {
    opacity: 1;
}
.player-3d-box:hover {
    transform: rotateX(4deg) rotateY(-2deg);
}
.player-inner h3 {
    font-size: 28px;
    color: var(--blue);
    margin-bottom: 16px;
}
.player-inner p {
    color: var(--text-gray);
    font-size: 16px;
    margin-bottom: 30px;
    max-width: 600px;
}
/* 页面切换遮罩动画 */
.page-transition-mask {
    position: fixed;
    inset: 0;
    background: var(--bg-base);
    z-index: 9999;
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.page-transition-mask.active {
    display: flex;
    opacity: 1;
}
/* 页脚 */
footer {
    width: min(1200px, 92%);
    margin: 0 auto;
    padding: 50px 0;
    text-align: center;
    border-top: 1px solid var(--border-line);
    color: #777;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="bg-flow-wrap">
    <div class="light-strip"></div>
    <div class="light-strip"></div>
</div>
<div class="page-transition-mask" id="pageTrans"></div>

<header id="navBar">
    <div class="nav-left">
        <a href="./index.html" class="active">首页</a>
        <a href="./feature.html" onclick="jumpPage(event,'./feature.html')">产品功能</a>
        <!-- 修正跳转目标 about.html，路径无误 -->
        <a href="./about.html" onclick="jumpPage(event,'./about.html')">关于我们</a>
    </div>
    <div class="nav-right">
        <input class="search-box" placeholder="搜索歌曲、专辑">
        <a href="./download.html" class="download-nav" onclick="jumpPage(event,'./download.html')">客户端下载</a>
    </div>
</header>

<div class="banner">
    <div class="banner-title">
        <h1>南阳音乐。</h1>
        <p>纯粹的本地音乐体验</p>
    </div>

    <div class="card-stack">
        <!-- 左侧卡片 图片1.png -->
        <div class="card-small-1">
            <img class="preview-img" src="1.png" alt="南阳音乐主界面">
            <h3>南阳音乐</h3>
            <p>本地曲库独立管理，脱离流媒体平台限制</p>
        </div>
        <!-- 右侧卡片 图片2.png -->
        <div class="card-small-2">
            <img class="preview-img" src="2.png" alt="智能AI播放模块">
            <h3>智能AI播放</h3>
            <p>AI智能推荐歌单，自动匹配本地无损音频</p>
        </div>

        <div class="card-main-download">
            <h2>纯粹的本地音乐体验</h2>
            <p>所有音乐文件本地存储，不存在歌曲下架、版权灰标；内置AI智能播放引擎，3D立体播放界面，纯净无广告无付费弹窗。</p>
            <div class="download-btn-wrap">
                <button class="download-main-btn" onclick="jumpPage(event,'./download.html')">下载客户端</button>
                <a href="./feature.html" class="download-side-btn" onclick="jumpPage(event,'./feature.html')">查看全部功能</a>
            </div>
        </div>
    </div>
</div>

<section class="player-section" id="playerWrap">
    <h2 class="player-title">3D立体AI播放器</h2>
    <div class="player-3d-box">
        <div class="player-inner">
            <h3>立体可视化播放界面</h3>
            <p>立体波形动效、本地LRC歌词同步、无损全格式兼容，仅页面视觉展示</p>
            <button class="download-side-btn" onclick="jumpPage(event,'./download.html')">下载体验完整播放器</button>
        </div>
    </div>
</section>

<footer>
© 2026 南阳数码工作室 · 南阳音乐 | 仅页面视觉展示，非商用软件
</footer>

<script>
// 页面跳转淡入过渡函数，about.html路径正常调用
const mask = document.getElementById('pageTrans');
function jumpPage(e, url) {
    e.preventDefault();
    mask.classList.add('active');
    setTimeout(()=>{
        window.location.href = url;
    }, 300);
}

// 导航滚动样式切换
const navBar = document.getElementById('navBar');
window.addEventListener('scroll', ()=>{
    if(window.scrollY > 60) {
        navBar.classList.add('scroll-active');
    } else {
        navBar.classList.remove('scroll-active');
})

// 滚动触发播放器区域入场动画
const playerTitle = document.querySelector('.player-title');
const playerBox = document.querySelector('.player-3d-box');
window.addEventListener('scroll', ()=>{
    const rect = document.getElementById('playerWrap').getBoundingClientRect();
    if(rect.top < window.innerHeight * 0.75) {
        playerTitle.classList.add('show');
        playerBox.classList.add('show');
    }
})
</script>
</body>
</html>

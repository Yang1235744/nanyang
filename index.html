<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南阳极客数码官网</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
body{background:url(https://picsum.photos/id/1036/1920/1080) no-repeat center center fixed;background-size:cover;position:relative;min-height:100vh;color:#fff;}
body::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:-1;}

/* 液态玻璃导航侧边栏（原样式完全保留） */
.nav{position:fixed;top:0;left:0;width:100%;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;z-index:999;
background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);overflow:hidden;transition: background 0.3s ease, backdrop-filter 0.3s ease;}
.left-sidebar{position:fixed;top:70px;left:0;width:200px;height:calc(100vh - 70px);padding:20px;
background:rgba(255,255,255,0.03);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,0.06);overflow:hidden;transition: background 0.3s ease, backdrop-filter 0.3s ease;}
.nav.no-glass{background:transparent !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border:none !important;}
.left-sidebar.no-glass{background:transparent !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border:none !important;}
.nav .light-spot,.left-sidebar .light-spot{position:absolute;width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,0.15),transparent 70%);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);}
.nav .logo{font-size:22px;font-weight:bold;color:#87CEEB;}
.nav .menu{display:flex;align-items:center;gap:12px;}
.nav .menu a{color:#ccc;text-decoration:none;font-size:16px;padding:6px 14px;border-radius:25px;background:rgba(255,255,255,0.06);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:0.2s;}
.nav .menu a:hover{background:rgba(135,206,235,0.2);color:#fff;}

/* ===================== 新增：防火墙拦截弹窗样式 ===================== */
.firewall-block-layer{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    background:rgba(0,0,0,0.92);backdrop-filter:blur(24px);
    z-index:9999999;display:flex;align-items:center;justify-content:center;
}
.firewall-card{
    width:90%;max-width:460px;padding:36px;
    background:rgba(220,30,30,0.12);backdrop-filter:blur(20px);
    border:1px solid rgba(255,80,80,0.22);border-radius:18px;text-align:center;
}
.firewall-card h2{color:#ff7575;margin-bottom:16px;font-size:24px;}
.firewall-card p{color:#e8e8e8;line-height:1.7;font-size:15px;margin:8px 0;}

/* ===================== 新增：真人验证弹窗样式 ===================== */
.verify-mask{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    background:rgba(0,0,0,0.88);backdrop-filter:blur(16px);
    z-index:999999;display:flex;align-items:center;justify-content:center;
}
.verify-box{
    width:92%;max-width:450px;padding:28px;
    background:rgba(255,255,255,0.06);backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,0.1);border-radius:16px;
}
.verify-box h2{text-align:center;margin-bottom:22px;color:#87CEEB;}
.tip-text{font-size:14px;color:#c5c5c5;margin:10px 0 20px;text-align:center;line-height:1.6}
.voice-box{background:rgba(135,206,235,0.08);padding:20px;border-radius:12px;margin-bottom:20px;text-align:center}
.code-show{font-size:34px;font-weight:bold;color:#87CEEB;margin:14px 0;letter-spacing:8px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:#1989d8;color:#fff;font-size:16px;cursor:pointer;margin-top:10px;transition:0.2s}
.btn:disabled{background:#638cb8;cursor:not-allowed;opacity:0.65}
.btn:hover:not(:disabled){background:#34a1ec}
.slide-box{margin:24px 0;display:none}
.slide-track{width:100%;height:46px;background:rgba(255,255,255,0.08);border-radius:10px;position:relative;overflow:hidden}
.slide-fill{height:100%;background:#34a1ec;width:0;transition:0.06s linear}
.slide-block{width:50px;height:46px;background:#fff;border:1px solid rgba(200,220,240,0.4);border-radius:10px;position:absolute;top:0;left:0;cursor:grab;text-align:center;line-height:46px;color:#1989d8;font-weight:bold}
.slide-text{position:absolute;top:0;left:0;right:0;bottom:0;text-align:center;line-height:46px;color:#aaa;pointer-events:none}
.face-box{margin:20px 0;display:none;text-align:center}
#mobileCam{width:100%;border-radius:10px;background:#000;min-height:250px;margin:10px 0}
.result{margin-top:18px;font-size:19px;font-weight:bold}
.success{color:#4cd964}
.fail{color:#ff6b6b}
.hidden{display:none !important}

/* 网站主体内容默认隐藏，验证通过才展示 */
.site-main{visibility:hidden;opacity:0;transition:opacity 0.6s ease;}
.site-main.unlock{visibility:visible;opacity:1;}
</style>
</head>
<body>
<!-- 重型防火墙拦截层（境外IP触发） -->
<div class="firewall-block-layer hidden" id="firewallBlock">
    <div class="firewall-card">
        <h2>防火墙访问拦截</h2>
        <p>检测到境外网络IP地址，本站防火墙已阻断本次访问</p>
        <p>南阳极客数码官网仅允许中国大陆境内网络访问</p>
        <p>如需访问，请切换国内运营商网络后重试</p>
    </div>
</div>

<!-- 真人验证弹窗（国内IP强制触发） -->
<div class="verify-mask hidden" id="verifyMask">
    <div class="verify-box">
        <h2>真人安全校验</h2>
        <p class="tip-text">系统自动检测麦克风/摄像头，全部校验完成解锁网站</p>

        <!-- 语音验证码模块（有麦克风展示） -->
        <div class="voice-box" id="voicePanel">
            <p>朗读下方4位数字完成语音活体验证</p>
            <div class="code-show" id="randCode">----</div>
            <button class="btn" id="playVoiceBtn">播放数字语音提示</button>
            <button class="btn" id="recordBtn" disabled>按住说话朗读数字</button>
            <div class="result" id="voiceResult"></div>
        </div>

        <!-- 滑块兜底验证（无麦克风自动切换） -->
        <div class="slide-box" id="slidePanel">
            <div class="slide-track">
                <div class="slide-fill"></div>
                <div class="slide-block">≡</div>
                <div class="slide-text">向右拖拽滑块完成验证</div>
            </div>
            <div class="result" id="slideResult"></div>
        </div>

        <!-- 手机端人脸识别模块 -->
        <div class="face-box" id="facePanel">
            <p>人脸活体核验，请正对摄像头露出完整五官</p>
            <video id="mobileCam" autoplay playsinline muted></video>
            <div class="result" id="faceResult"></div>
        </div>

        <button class="btn hidden" id="enterSiteBtn">全部验证通过，进入官网</button>
    </div>
</div>

<!-- 你的原有官网主体（完全未改动） -->
<div class="site-main" id="siteWrap">
    <div class="nav">
        <div class="logo">南阳极客数码</div>
        <div class="light-spot"></div>
        <div class="menu">
            <a href="#">首页</a>
            <a href="#">作品展示</a>
            <a href="#">服务器</a>
            <a href="#">关于我们</a>
        </div>
    </div>
    <div class="left-sidebar">
        <div class="light-spot"></div>
        <p style="margin:10px 0 20px;font-size:17px;color:#87CEEB;">功能导航</p>
        <a href="#" style="display:block;color:#ccc;margin:12px 0;text-decoration:none;">硬件改造</a>
        <a href="#" style="display:block;color:#ccc;margin:12px 0;text-decoration:none;">系统教程</a>
        <a href="#" style="display:block;color:#ccc;margin:12px 0;text-decoration:none;">MC服务器</a>
        <a href="#" style="display:block;color:#ccc;margin:12px 0;text-decoration:none;">联系我</a>
    </div>
    <!-- 这里放你网站其余原有内容，完全不用改动 -->
</div>

<script>
// ===================== 重型强化防火墙IP拦截逻辑 =====================
(async function FirewallHeavyDefense(){
    // 国内IP段库，重度扩充覆盖全运营商
    const chinaIPRanges = [
        /^10\./,/^192\.168\./,/^172\.1[6-9]\./,/^172\.2[0-9]\./,/^172\.3[0-1]\./,
        /^1\.0\./,/^1\.1\./,/^14\.0\./,/^27\./,/^36\./,/^39\./,/^42\./,/^49\./,
        /^58\./,/^59\./,/^60\./,/^61\./,/^106\./,/^110\./,/^111\./,/^112\./,
        /^113\./,/^114\./,/^115\./,/^116\./,/^117\./,/^118\./,/^119\./,
        /^120\./,/^121\./,/^122\./,/^123\./,/^124\./,/^125\./,/^175\./,
        /^180\./,/^182\./,/^183\./,/^218\./,/^219\./,/^220\./,/^221\./,
        /^222\./,/^223\./,/^224\./,/^240\./,/^241\./,/^242\./,/^243\./
    ];
    const firewallBlock = document.getElementById("firewallBlock");
    const verifyMask = document.getElementById("verifyMask");
    const siteWrap = document.getElementById("siteWrap");

    try{
        // 多层IP检测接口，防止单一接口失效绕过防火墙
        let ip = null;
        const ipApis = [
            "https://api.ipify.org?format=json",
            "https://httpbin.org/ip",
            "https://icanhazip.com"
        ];
        for(let api of ipApis){
            try{
                const res = await fetch(api,{signal:AbortSignal.timeout(2200)});
                if(api.includes("ipify") || api.includes("httpbin")){
                    const data = await res.json();
                    ip = data.ip || data.origin;
                }else{
                    ip = await res.text();
                    ip = ip.trim();
                }
                break;
            }catch(e){continue;}
        }
        // 无IP获取到，默认放行国内验证
        if(!ip){
            verifyMask.classList.remove("hidden");
            startVerifySystem();
            return;
        }
        // 匹配国内IP段
        let isChinaIP = false;
        for(let reg of chinaIPRanges){
            if(reg.test(ip)){
                isChinaIP = true;
                break;
            }
        }
        if(!isChinaIP){
            // 境外IP触发重型拦截，永久阻断页面
            firewallBlock.classList.remove("hidden");
            document.body.style.overflow = "hidden";
            return;
        }else{
            // 国内IP，弹出真人验证系统
            verifyMask.classList.remove("hidden");
            document.body.style.overflow = "hidden";
            startVerifySystem();
        }
    }catch(err){
        // 网络异常默认走国内验证流程
        verifyMask.classList.remove("hidden");
        startVerifySystem();
    }
})();

// ===================== 真人验证全套逻辑 =====================
function startVerifySystem(){
    // 全局校验标记
    let voicePass = false;
    let slidePass = false;
    let facePass = !(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent));
    let hasMicrophone = false;
    let target4Code = "";
    let camStream = null;

    // 语音播报工具
    function speakTxt(text){
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "zh-CN";
        utter.rate = 0.94;
        window.speechSynthesis.speak(utter);
    }

    // 生成4位随机验证码
    function makeRandCode(){
        let numStr = "";
        for(let i=0;i<4;i++) numStr += Math.floor(Math.random()*10);
        target4Code = numStr;
        document.getElementById("randCode").innerText = numStr;
    }

    // 全部校验完成，解锁官网
    function checkAllValid(){
        if((voicePass || slidePass) && facePass){
            document.getElementById("enterSiteBtn").classList.remove("hidden");
        }
    }

    // 1.麦克风检测，区分语音/滑块
    navigator.mediaDevices.enumerateDevices().then(devs=>{
        hasMicrophone = devs.some(d=>d.kind === "audioinput");
        const voicePanel = document.getElementById("voicePanel");
        const slidePanel = document.getElementById("slidePanel");
        if(!hasMicrophone){
            voicePanel.classList.add("hidden");
            slidePanel.style.display = "block";
            initSlideVerify();
        }else{
            makeRandCode();
            initVoiceRec();
        }
    });

    // 2.手机端人脸核验初始化
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        document.getElementById("facePanel").style.display = "block";
        initMobileFaceCam();
    }

    // 语音识别模块
    function initVoiceRec(){
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const playBtn = document.getElementById("playVoiceBtn");
        const recBtn = document.getElementById("recordBtn");
        const voiceResDom = document.getElementById("voiceResult");
        playBtn.onclick = ()=> speakTxt("请朗读数字：" + target4Code);
        recBtn.disabled = false;
        recBtn.onmousedown = ()=>{
            if(!SpeechRec){
                voiceResDom.innerText = "浏览器不支持语音识别，请使用滑块验证";
                voiceResDom.className = "result fail";
                return;
            }
            const recog = new SpeechRec();
            recog.lang = "zh-CN";
            recog.start();
            voiceResDom.innerText = "正在识别朗读声音...";
            recog.onresult = (ev)=>{
                let rawText = ev.results[0][0].transcript.replace(/[^0-9]/g,"");
                if(rawText.includes(target4Code)){
                    voicePass = true;
                    voiceResDom.innerText = "语音验证码匹配成功";
                    voiceResDom.className = "result success";
                    checkAllValid();
                }else{
                    voiceResDom.innerText = `识别到数字：${rawText}，与验证码不符，请重新朗读`;
                    voiceResDom.className = "result fail";
                    makeRandCode();
                    speakTxt("新验证码：" + target4Code);
                }
            }
        }
    }

    // 滑块验证模块
    function initSlideVerify(){
        const track = document.querySelector(".slide-track");
        const fill = document.querySelector(".slide-fill");
        const block = document.querySelector(".slide-block");
        const slideResDom = document.getElementById("slideResult");
        let dragStatus = false;
        const maxMoveX = track.offsetWidth - block.offsetWidth;
        // 鼠标拖拽
        block.onmousedown = e=>{dragStatus = true;e.preventDefault();}
        document.onmousemove = e=>{
            if(!dragStatus || slidePass) return;
            const rect = track.getBoundingClientRect();
            let moveX = e.clientX - rect.left - block.offsetWidth/2;
            moveX = Math.max(0, Math.min(maxMoveX, moveX));
            block.style.left = moveX + "px";
            fill.style.width = moveX + block.offsetWidth/2 + "px";
            if(moveX >= maxMoveX - 12){
                slidePass = true;
                slideResDom.innerText = "滑块验证通过";
                slideResDom.className = "result success";
                checkAllValid();
            }else slideResDom.innerText = "";
        }
        document.onmouseup = ()=> dragStatus = false;
        // 手机触摸适配
        block.ontouchstart = e=>{dragStatus = true;e.preventDefault();}
        document.ontouchmove = e=>{
            if(!dragStatus || slidePass) return;
            const rect = track.getBoundingClientRect();
            const touch = e.touches[0];
            let moveX = touch.clientX - rect.left - block.offsetWidth/2;
            moveX = Math.max(0, Math.min(maxMoveX, moveX));
            block.style.left = moveX + "px";
            fill.style.width = moveX + block.offsetWidth/2 + "px";
            if(moveX >= maxMoveX - 12){
                slidePass = true;
                slideResDom.innerText = "滑块验证通过";
                slideResDom.className = "result success";
                checkAllValid();
            }
        }
        document.ontouchend = ()=> dragStatus = false;
    }

    // 手机人脸摄像头自动核验（简易人脸存在检测）
    function initMobileFaceCam(){
        const camDom = document.getElementById("mobileCam");
        const faceResDom = document.getElementById("faceResult");
        navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(stream=>{
            camStream = stream;
            camDom.srcObject = stream;
            // 模拟人脸检测，画面加载3秒自动判定存在人脸
            setTimeout(()=>{
                facePass = true;
                faceResDom.innerText = "人脸活体核验完成";
                faceResDom.className = "result success";
                checkAllValid();
            },3000);
        }).catch(()=>{
            faceResDom.innerText = "无法调用摄像头，已自动跳过人脸校验";
            facePass = true;
            checkAllValid();
        })
    }

    // 进入官网按钮点击事件
    document.getElementById("enterSiteBtn").onclick = ()=>{
        document.getElementById("verifyMask").classList.add("hidden");
        document.body.style.overflow = "";
        document.getElementById("siteWrap").classList.add("unlock");
        // 停止摄像头、麦克风占用
        if(camStream) camStream.getTracks().forEach(t=>t.stop());
    }
}

// 导航鼠标光斑跟随效果（原有功能保留）
const navLight = document.querySelector(".nav .light-spot");
const sideLight = document.querySelector(".left-sidebar .light-spot");
document.onmousemove = e=>{
    navLight.style.left = e.clientX + "px";
    navLight.style.top = e.clientY + "px";
    sideLight.style.left = e.clientX + "px";
    sideLight.style.top = e.clientY + "px";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站升级通知</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#000;
    font-family:Microsoft YaHei, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}
.win-box{
    width:520px;
    background:#f0f0f0;
    border:3px solid #005aae;
    border-radius:4px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}
.win-title{
    background:#005aae;
    color:#fff;
    padding:8px 12px;
    font-size:14px;
    display:flex;
    justify-content:space-between;
}
.win-content{
    padding:24px;
    background:#fff;
    color:#000;
    font-size:14px;
    line-height:1.7;
}
.win-btn{
    text-align:right;
    padding:12px 16px;
    background:#f0f0f0;
}
.win-btn button{
    width:85px;
    padding:6px 0;
    background:#e1e1e1;
    border:1px solid #888;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="win-box">
    <div class="win-title">
        <span>网站升级提示</span>
        <span>×</span>
    </div>
    <div class="win-content">
        官网正在全面升级中，漏洞正在强制修复，已禁止原文件下载。<br>
        本网站已迁移到云端南云工作室服务器中，数据已上传并保护。<br><br>
        当前页面为启动器（连接端），服务器端为云端。<br>
        官网正在重新搭建，请耐心等待。
    </div>
    <div class="win-btn">
        <button onclick="window.close()">确定</button>
    </div>
</div>

</body>
</html>
